[pytest]
;addopts = -vs --alluredir ./report/temp -p no:warnings --clean-alluredir
;
;testpaths = ./testcase/

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

#只把文件名以test_开头的py文件当做测试用例文件
python_files = test_*.py

#识别测试类
python_classes = Test*

#识别测试函数，测试方法
python_functions = test
